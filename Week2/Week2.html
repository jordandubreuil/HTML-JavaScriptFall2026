<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Week 2 JavaScript Lab</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face {
                font-family: digital;
                src: url(fonts/DS-DIGIT.TTF);
            }
            body{
                background-color: cornflowerblue;
            }
            #container{
                width: 100%;
                text-align: center; 
            }
            #output{
                font-family: "digital";
                color: greenyellow;
                background-color: black;
                font-size: 60px;
                width: 100px;
                margin-left: auto;
                margin-right: auto;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1>Week 2 JavaScript Lab</h1>
            <span id="message"></span>
            <hr>
            <br>
            <h2>Button Clicker</h2>
            <h3 id="output">0</h3>
            <input type="button" value="Click Me!!" id="btn">
            <input type="button" value="Clear Clicks" id="btn-reset">
        </div>
        

        <!-- Example JavaScript -->
         <script>
            //This is the example JavaScript code
            // var name = prompt("What is your name??")
            // var firstNumber = prompt("Give me your first number");
            // var secondNumber = prompt("Give me your second number");
            // var value = firstNumber * secondNumber;
            // var message = `Hello ${name}!
            //     \nYour first number was:${firstNumber}
            //     \nYour second number is:${secondNumber}
            //     \nYour value is: ${value}`;
            // console.log(message);
            // document.getElementById("message").innerHTML = message;
            // document.getElementById("message").style.color = "green";

            //Button Clicker Game
            var clickerButton = document.querySelector("#btn");
            var clearButton = document.querySelector("#btn-reset");
            var clickerOutput = document.querySelector("#output");

            var numberOfClicks = 0;

            clickerButton.addEventListener("click", function(){
                numberOfClicks++;
                updateClickerDisplay();

                if(numberOfClicks == 25){
                    alert("You made 25 clicks!");
                }
            });

            clearButton.addEventListener("click", function(){
                numberOfClicks = 0;
                updateClickerDisplay();
            });

            function updateClickerDisplay(){
                clickerOutput.innerHTML = numberOfClicks;
            }
            
         </script>
    </body>
</html>
